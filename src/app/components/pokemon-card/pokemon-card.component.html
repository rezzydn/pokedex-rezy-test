<div class="pokemon-card" (click)="open.emit(pokemon)" role="button" [style.--plate-tint]="plateTint">
  <div class="plate">
    <span class="dex-tag">No. {{ pokemon.id.toString().padStart(3, '0') }}</span>
    <button class="favorite-btn" (click)="toggleFavorite($event)" aria-label="Toggle favorite">
      <ion-icon [name]="(isFavorite$ | async) ? 'heart' : 'heart-outline'"></ion-icon>
    </button>
    <ion-img [src]="pokemon.imageUrl" [alt]="pokemon.name"></ion-img>
  </div>
  <div class="caption">
    <span class="name capitalize">{{ pokemon.name }}</span>
  </div>
</div>
